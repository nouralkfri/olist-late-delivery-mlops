services:
  postgres:
    image: postgres:16
    container_name: olist_db
    environment:
      POSTGRES_USER: nour
      POSTGRES_PASSWORD: olist123
      POSTGRES_DB: olist
    ports:
      - "5432:5432"
    volumes:
      - olist_pgdata:/var/lib/postgresql/data

  api:
    build: .
    container_name: olist_api
    ports:
      - "8000:8000"
    depends_on:
      - postgres

volumes:
  olist_pgdata: